<!doctype html><html><head><meta charset="utf-8"><title>Hello</title>
<style>body{font:20px system-ui;margin:40px;background:#f4efe6;color:#222}button{font:inherit;padding:8px 16px}</style></head>
<body><h1>Hello from OpenAs</h1><p id="n">0 clicks</p><button id="b">Click</button>
<script>
let n = 0;
document.getElementById("b").onclick = async () => { n++; document.getElementById("n").textContent = n + " clicks"; await app.store.set("n", n); };
app.store.get("n").then(v => { if (v) { n = v; document.getElementById("n").textContent = n + " clicks"; } });
fetch("https://example.com/").catch(() => {});
</script></body></html>
