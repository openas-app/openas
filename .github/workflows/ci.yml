name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Simulated desktop compiles
        run: swiftc -O tools/snap.swift -o target/snap

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Smoke - the Runner opens an app (load check)
        shell: pwsh
        run: |
          cargo build --release -p runner
          $d = "$env:RUNNER_TEMP\hello"; Copy-Item -Recurse tools/smoke/hello $d
          $p = Start-Process target/release/runner.exe -ArgumentList "--check",$d,"--report","$d\r.json" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "load check timed out" }
          Get-Content "$d\r.json"
