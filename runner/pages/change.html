<!doctype html><html><head><meta charset="utf-8"><title>Change</title>
<style>
:root{--bg:#F4F4F5;--fg:#0B0B0C;--mute:#52525B;--line:#D4D4D8;--field:#FFFFFF;--accent:#0B0B0C;--on-accent:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B0C;--fg:#F4F4F5;--mute:#A1A1AA;--line:#2E2E33;--field:#161618;--accent:#FFFFFF;--on-accent:#0B0B0C}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
main{display:flex;flex-direction:column;gap:12px;padding:18px;height:100%}
h1{font-size:14px;font-weight:600;margin:0}
textarea{flex:1;min-height:70px;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);font:inherit;line-height:1.45;outline:none}
textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}.row .grow{flex:1;color:var(--mute);min-height:1.4em}
button{font:inherit;padding:6px 14px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}button:disabled{opacity:.5;cursor:default}
.bad{color:#c4452c}
</style></head><body><main>
<h1 id="h">Change this app</h1>
<textarea id="t" autofocus placeholder="What should change? For example: add a search box, or sort by date"></textarea>
<div class="row"><span class="grow" id="s"></span><button id="c">Cancel</button><button class="go" id="g">Change</button></div>
</main><script>
h.textContent = "Change " + (window.oa && oa.appName || "this app");
let JOB = 0;
const busy = on => { g.disabled = on; t.disabled = on; c.textContent = on ? "Stop" : "Cancel"; };
c.onclick = () => { if (c.textContent === "Stop") { oa.stop(JOB); s.textContent = "Stopping…"; } else oa.close(); };
addEventListener("keydown", e => { if (e.key === "Escape") oa.close(); if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) g.click(); });
g.onclick = async () => {
  const text = t.value.trim(); if (!text) return t.focus();
  busy(true); s.className = "grow"; s.textContent = "Starting…";
  const job = JOB = await oa.start({ op: "change", request: text });
  const tick = async () => {
    const r = await oa.poll(job);
    if (r.line) s.textContent = r.line.trim();
    if (!r.done) return setTimeout(tick, 400);
    if (r.done.error) {
      const stopped = /^Stopped/.test(r.done.error);
      s.className = stopped ? "grow" : "grow bad"; s.textContent = stopped ? "Stopped. Nothing changed." : r.done.error; busy(false); return;
    }
    const p = r.done.ok.problems || [];
    if (p.length) { s.className = "grow bad"; s.textContent = "Kept the old version: " + p[0]; busy(false); return; }
    if (r.done.ok.warning) { s.textContent = "Done. " + r.done.ok.warning; busy(false); g.disabled = true; c.textContent = "Close"; return; }
    s.textContent = "Done."; setTimeout(() => oa.close(), 600);
  };
  tick();
};
</script></body></html>
