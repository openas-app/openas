<!doctype html><html><head><meta charset="utf-8"><title>Conversation</title>
<style>

*{box-sizing:border-box}

body{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.head.plain{height:44px;border-bottom:0;margin-bottom:0;padding-left:16px}
.ttl{display:flex;align-items:center;min-width:0;flex:1}
.nameBtn{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--fg);cursor:default;font:inherit}

body:not(.inhome) .nameBtn{padding:0;pointer-events:none}
.menu{position:fixed;z-index:6;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:5px}
.mi{padding:7px 10px;border-radius:7px;font-size:13px;line-height:18px;color:var(--fg)}.mi:hover{background:var(--you)}
.msep{height:1px;background:var(--line);margin:4px 6px}
/* OpenAs's window: one bar across, the conversation left, the app in a panel right. */
.col{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.right{display:none}
.hint{flex:none}
body.inhome{flex-direction:row;border-left:0;--tw:min(380px,50vw)}
body.inhome .col{flex:none;width:var(--tw)}
body.inhome .head{height:52px;border-bottom:0;margin-bottom:0;padding:0 8px 0 80px;gap:2px}
html.win body.inhome .head{padding-left:16px}
body.inhome .right{display:flex;flex-direction:column;flex:1;min-width:0}
body.inhome .rhead{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px}
body.inhome .stage{flex:1;margin:0 8px 8px 8px;border-radius:10px;background:var(--you)}
body.inhome .thread .who{display:none}
body.inhome .plan{background:transparent;border:0;padding:0}

.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;line-height:16px;color:var(--mute)}
.chip .sp{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--fg);animation:spin 1s linear infinite}

.chip.bad{color:var(--bad)}.chip.bad .ok{background:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.back{width:32px;height:32px;flex:none;border-radius:7px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:default}
.back:hover{background:var(--you);color:var(--fg)}
.head .grow{flex:1}
.x{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}.x:hover{background:var(--you);color:var(--fg)}

.thread::-webkit-scrollbar{width:0}
.spacer{flex:1}
.you{align-self:flex-end;max-width:88%;background:var(--you);padding:9px 12px;border-radius:14px 14px 4px 14px;-webkit-user-select:text;user-select:text;white-space:pre-wrap}
.you .when{display:block;color:var(--faint);font-size:11px;margin-top:3px}
.oa{display:flex;flex-direction:column;gap:9px}
.oa p{margin:0}

.who b{color:var(--mute);font-weight:600}
.mark{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center;position:relative}
.mark::after{content:"";width:5px;height:5px;background:var(--signal)}
.work{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.latest{color:var(--mute);font-size:12.5px;line-height:1.5;padding-left:19px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fold{margin:6px 0 0 19px;color:var(--faint);font-size:12px}
.fold summary{cursor:default;list-style:none}.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"›";display:inline-block;width:12px;transition:transform .15s}.fold[open] summary::before{transform:rotate(90deg)}
.fold .all{margin-top:6px;max-height:16em;overflow:auto;white-space:pre-wrap;color:var(--mute);line-height:1.5}
.thinking{color:var(--mute);font-size:12.5px;line-height:1.55;max-height:12.4em;overflow:hidden;white-space:pre-wrap;display:flex;flex-direction:column;justify-content:flex-end;padding-left:19px}
.thinking.fade{-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.thinking.long{max-height:18.6em}
.plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.parts{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.parts li{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mute)}
.parts li .st{width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.parts li.done{color:var(--fg)}
.parts li.done .st{background:var(--accent);border-color:var(--accent)}
.parts li.done .st::after{content:"";width:6px;height:3.5px;border-left:1.6px solid var(--bg);border-bottom:1.6px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.parts li.now{color:var(--fg);font-weight:500}
.parts li.now .st{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.parts li .note{margin-left:auto;color:var(--faint);font-weight:400;font-size:11.5px;font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px}
.status .spin{width:11px;height:11px;flex:none;border-radius:50%;border:1.6px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
.summary{-webkit-user-select:text;user-select:text}
/* One line first; a click opens the rest in place. */
.zoom{cursor:default}
.zoom .more{color:var(--faint);font-size:13px;white-space:nowrap}.zoom:hover .more{color:var(--fg)}
.zoom.anim,.pd.anim{animation:zin .18s ease-out}

.parts li.can{cursor:default}
.parts li .cv{width:10px;flex:none;color:var(--faint);transition:transform .15s;margin-left:2px}
.parts li.can:hover,.parts li.can:hover .cv{color:var(--fg)}
.parts li.opened .cv{transform:rotate(90deg)}
.parts li .note + .cv{margin-left:8px}
.parts li.pd{display:block;padding:0 0 4px 24px;color:var(--mute);font-weight:400;font-size:12.5px;line-height:1.5}
.pd div{position:relative;padding-left:11px}.pd div::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.pd .files{margin-top:4px;padding:0;font:500 11px/16px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--faint)}.pd .files::before{display:none}
.latest{cursor:default}
.meta{color:var(--faint);font-size:11.5px;display:flex;gap:10px;align-items:center}
.meta .grow{flex:1}
.link{color:var(--fg);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line);cursor:pointer}
.ver{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--mute)}

.ver .now{margin-left:auto;font-size:11px;color:var(--accent);font-weight:600;flex:none}
.ver .link{margin-left:auto;font-size:11.5px;flex:none}

.steer{align-self:flex-end;max-width:88%;border:1px dashed var(--line);color:var(--mute);padding:7px 11px;border-radius:12px;font-size:12.5px;white-space:pre-wrap}

.bad{color:var(--bad)}
.empty{color:var(--faint);font-size:12.5px;text-align:center;padding:30px 10px}
.box{margin:0 14px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);padding:10px 10px 8px 12px;box-shadow:var(--shadow);flex:none}

.row{display:flex;align-items:center;gap:8px;margin-top:4px}
.hint{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;padding:0 18px 12px;margin-top:-8px}
.row .grow,.rhead .grow{flex:1}
/* The bar's tools over the app: code, fill the window, share, save. */
.tools{display:flex;gap:2px;flex:none}
.tb{width:30px;height:30px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:default}
.tb:hover:not(:disabled):not(.off),.tb.on{background:var(--you);color:var(--fg)}
.tb:disabled,.tb.off{opacity:.35}
body.full{--tw:0px}body.full .col{display:none}body.full .rhead{padding-left:92px}
.btn{width:26px;height:26px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:default;font:700 14px/1 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.send{background:var(--accent);color:var(--on-accent)}.send:disabled{background:var(--line)}
.stop{background:var(--fg)}.stop::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--card)}
.code{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
.code.on{display:flex}
.code .tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;align-items:center}
.code .tab{padding:3px 9px;border-radius:6px;color:var(--mute);font-size:12px;white-space:nowrap}
.code .tab.on{background:var(--you);color:var(--fg)}
/* In OpenAs's window the code takes the app's place in the panel. */
body.inhome .code{inset:var(--bar,52px) 8px 8px calc(var(--tw) + 8px);border:1px solid color-mix(in srgb,#808080 35%,transparent);border-radius:10px;overflow:hidden;background:var(--card)}
.code pre{flex:1;margin:0;overflow:auto;padding:12px 14px;font:500 12px/18px "JetBrains Mono",ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;white-space:pre}

<script>

// A draft whose build ended early: carry on, or throw it away.
const carryOnHtml = m => {
  if (S.mode !== "making") return "";
  if (discarding) return `<div class="ready"><div><b>Discarding…</b></div></div>`;
  return `<div class="acts"><button class="b1" data-act="carry-on">${m.phase === "failed" ? "Try again" : "Continue"}</button><button class="b2" data-act="ask-discard">Discard</button></div>`;
};
function makingHtml(m) {
  let h = "";
  // Carried on after a stop: the first request stays where it was asked.
  if (S.first && m.request !== S.first) h += `<div class="you">${esc(S.first)}</div><p class="meta">It stopped before it was finished.</p>`;
  h += `<div class="you">${esc(m.request)}<span class="when">${when(m.started)}</span></div><div class="oa">`;
  const planning = !m.plan;
  h += who(m.phase === "done" ? "" : planning ? "planning" : m.kind === "change" ? "changing" : "making");
  // Once it's done, the closing summary says what it is: the plan's own
  // summary would say it twice.
  if (m.plan) h += `<div class="plan">${m.phase === "done" ? "" : sumHtml("plan:" + m.started, m.plan.summary)}${partsHtml(m)}</div>`;
  for (const n of m.notes || []) h += `<div class="steer">${esc(n.text)}<small>Noted. Used from the next step.</small></div>`;
  for (const n of pending.filter(p => !(m.notes || []).some(x => x.text === p))) h += `<div class="steer">${esc(n)}<small>Sent. Read after the current step.</small></div>`;
  if (m.phase === "done") {
    if (thought.key === m.started && thought.ms >= 1000) h += foldHtml();
    if (m.unfinished) h += `<p class="summary">${esc(m.unfinished)} What it made so far is open beside this. If it works, save it; you can finish it later by asking for changes.</p>`;
    else h += sumHtml("sum:" + m.started, m.summary);
    const nm = esc(chosenName || m.name || "The app");
    if (S.mode === "making" && S.moved) h += `<div class="ready"><div><b>${S.moved.discarded ? "Discarded" : nm + " is in your Applications"}</b><span>${S.moved.discarded ? "Nothing was added to your Applications." : "It's opening now, in its own window."}</span></div></div>`;
    else if (S.mode === "making" && chosenName != null) h += `<div class="ready"><div><b>Saving ${nm}…</b><span>Adding it to your Applications</span></div></div>`;
    else if (S.mode === "making" && discarding) h += `<div class="ready"><div><b>Discarding…</b></div></div>`;
    h += `<div class="meta">${m.model ? esc(modelName(m.model)) + " · " : ""}${m.minutes} min · ${m.step} steps${m.usd != null ? " · $" + Number(m.usd).toFixed(2) : ""}<span class="grow"></span>${S.home ? "" : '<span class="link" role="button" tabindex="0" data-act="code">Show code</span>'}</div>`;
  } else if (m.phase === "failed") {
    const limit = String(m.error || "").startsWith("[limit] ");
    h += `<p class="bad">${limit ? "<b>Spending limit reached.</b> " : ""}${esc(String(m.error || "It stopped.").replace(/^\[limit\] /, ""))}</p><p class="meta">${m.kind === "change" ? "Nothing changed in your app." : "Nothing was installed."}</p>`;
    h += carryOnHtml(m);
  } else if (m.phase === "stopped") {
    h += `<p class="meta">Stopped. ${m.kind === "change" ? "Nothing changed in your app." : "Nothing was installed."}</p>`;
    h += carryOnHtml(m);
  } else {
    const what = planning ? "Thinking about how it should work" : m.phase === "checking" ? (m.doing || "Trying it out") : (m.doing || (m.tool === "view" || m.tool === "list" ? "Reading the app" : "Writing the app"));
    // What it's doing now, then its live words under it: the part that moves
    // sits together, just above where you type a note.
    h += `<div class="work"><div class="status"><span class="spin"></span>${esc(what)}${m.kb && m.phase !== "checking" ? " · " + m.kb + " KB" : ""}</div>`;
    const words = String(m.thinking || "").trim();
    track(m, words);
    // Only the newest sentence, live; everything before it folds into one line.
    const parts = words.split(/(?<=[.!?])\s+/).filter(Boolean), latest = parts[parts.length - 1] || "";
    if (latest) h += `<div class="latest" data-zoom="thought" role="button" tabindex="0" title="Show everything it thought">${esc(latest)}</div>`;
    if (thought.ms >= 1000) h += foldHtml();
    h += `</div>`;
  }
  return h + `</div>`;
}

function storyHtml() {
  let h = "";
  const live = versions.find(v => v.live);
  const entries = (S.story && S.story.length) ? S.story : versions.slice().reverse().map((v, i) => ({ request: i === 0 && v.label === "The first version" ? "The first version" : v.label, t: v.t }));
  entries.forEach((e, i) => {
    const label = i === 0 ? "The first version" : e.request;
    const name = i === 0 ? "First version" : e.request;
    h += `<div class="you">${esc(e.request)}<span class="when">${when(e.t)}</span></div><div class="oa">${who()}`;
    if (e.summary) h += sumHtml("story:" + (e.t || i), e.summary);
    // After going back, the version gone back to is the one in use.
    const isLive = live && live.label.replace(/^Back to: /, "") === label;
    const kept = versions.find(v => !v.live && v.label === label);
    if (isLive) h += `<div class="ver"><b>${esc(name)}</b><span class="now">Using now</span></div>`;
    else if (kept) h += `<div class="ver"><b>${esc(name)}</b><span class="link" role="button" tabindex="0" data-act="restore" data-v="${kept.version}">Go back to this</span></div>`;
    const code = isLive ? `<span class="grow"></span><span class="link" role="button" tabindex="0" data-act="code">Show code</span>` : "";
    if (e.minutes || isLive) h += `<div class="meta">${e.minutes ? e.minutes + " min · " + e.steps + " steps" + (e.usd != null ? " · $" + Number(e.usd).toFixed(2) : "") : ""}${code}</div>`;
    h += `</div>`;
  });
  if (!entries.length) h += `<div class="empty">Ask for a change below. Your app keeps working while it changes, and every version is kept.</div>`;
  return h;
}

function render() {
  const m = S.making && S.making.phase ? S.making : null;
  let h;
  if (S.mode === "making") h = m ? makingHtml(m) : "";
  else {
    h = storyHtml();
    const recentEnd = m && ["failed", "stopped"].includes(m.phase) && Date.now() / 1000 - (m.now || 0) < 30;
    if (m && (active(m) || recentEnd)) h += makingHtml(m);
  }
  if (h !== lastSig) {
    // Follows the newest only while you're at the bottom; once you scroll up
    // it stays exactly where you put it.
    const th = $("thread"), top = th.scrollTop;
    th.innerHTML = h; lastSig = h;
    // Rebuilt spinners carry on from the same clock instead of restarting.
    const phase = -(performance.now() % 1000) + "ms";
    th.querySelectorAll(".parts li.now .st, .status .spin").forEach(e => e.style.animationDelay = phase);
    th.scrollTop = follow ? th.scrollHeight : top;
  }
  $("headline").textContent = S.mode === "making" ? (m && m.name ? m.name : "New app") : S.name;
  // OpenAs's window: a bar with the way back, where the build is, and the
  // two choices once it's done.
  $("head").className = S.home ? "head" : "head plain";
  document.body.classList.toggle("inhome", !!S.home);
  const chip = $("chip");
  chip.hidden = !(S.home && m);
  if (S.home && m) {
    const working = WORKING.includes(m.phase), stuck = m.phase === "failed" || m.phase === "stopped";
    const saving = chosenName != null && !S.moved;
    chip.className = "chip" + (stuck ? " bad" : "");
    const label = S.moved ? (S.moved.discarded ? "Discarded" : "Saved to Applications")
      : saving ? "Saving…" : discarding ? "Discarding…"
      : working ? (m.plan ? "Building · step " + (m.step || 1) : "Planning")
      : m.phase === "done" ? "Ready to save" : m.phase === "stopped" ? "Stopped" : "Didn't finish";
    const icon = working || saving || discarding ? '<i class="sp"></i>' : '<i class="ok"></i>';
    if (chip.dataset.l !== label) { chip.dataset.l = label; chip.innerHTML = icon + esc(label); }
  }
  $("tools").hidden = !(S.home && m);
  // Another build shown, or this one saved: the conversation is back.
  if (full && (!m || S.moved || m.started !== fullKey)) setFull(false, true);
  $("tbSave").disabled = !(m && m.phase === "done" && !S.moved && chosenName == null && !discarding);
  $("close").style.display = S.mode === "making" ? "none" : "";
  $("homeLink").hidden = !S.home;
  const busy = !!m && WORKING.includes(m.phase) && (S.mode === "making" || active(m));
  const t = $("t"), send = $("send"), empty = !t.value.trim();
  t.placeholder = busy ? "Add a note while it works…" : "Ask for a change…";
  const ended = !!m && S.mode === "making" && (m.phase === "stopped" || m.phase === "failed") && !discarding;
  t.disabled = S.mode === "making" && !busy && !ended;
  if (ended) t.placeholder = "Continue, or say what to do next…";
  send.className = "btn " + (busy && empty ? "stop" : "send");
  send.textContent = busy && empty ? "" : "↑";
  send.disabled = !busy && (ended ? false : (empty || S.mode === "making"));
  send.title = busy && empty ? "Stop" : "Send";
  const el = m && m.started ? Math.max(0, (m.now || 0) - m.started) : 0;
  $("hint").textContent = busy ? (m.plan ? "Step " + (m.step || 1) + " · " : "Planning · ") + mins(el) : S.mode === "making" ? (m && m.phase === "done" && !S.moved && chosenName == null && !S.home ? "Save as App is in the menu bar" : "") : S.pending ? "Edited, not saved yet · Save as App is in the menu bar" : "Your app keeps working while it changes";
}

async function tick() {
  try { S = await oa.state(); render(); } catch (e) {}
  setTimeout(tick, 400);
}

async function loadVersions() {
  if (!S || S.mode === "making") return;
  const r = await run({ op: "versions" });
  if (r.ok) { versions = r.ok.versions || []; lastSig = ""; render(); }
}

$("thread").addEventListener("scroll", () => { const th = $("thread"); follow = th.scrollHeight - th.scrollTop - th.clientHeight < 24; }, { passive: true });
$("t").addEventListener("input", () => { const t = $("t"); t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; if (S) render(); });
$("t").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
  if (e.key === "Escape" && S && S.mode !== "making") oa.hide();
});
$("send").onclick = async () => {
  const t = $("t"), text = t.value.trim(), m = S && S.making;
  const busy = !!m && WORKING.includes(m.phase) && (S.mode === "making" || active(m));
  if (busy && !text) { await oa.stopMaking(); if (job && job.id != null) oa.stop(job.id); return; }
  if (!text) return;
  t.value = ""; t.style.height = "auto";
  follow = true; // what you just sent, and the answer, come into view
  if (busy) { pending.push(text); await oa.note(text); render(); return; }
  if (S.mode === "making" && m && (m.phase === "stopped" || m.phase === "failed")) { await carryOn(text); return; }
  if (S.mode === "making") return;
  pending = [];
  job = { id: null }; render();
  let id = null;
  try { id = await oa.start({ op: "change", request: text }); } catch (e) {}
  if (id == null) { job = null; render(); return; }
  job.id = id;
  const watch = async () => {
    const r = await oa.poll(id);
    if (!r.done) return setTimeout(watch, 600);
    job = null; await loadVersions();
  };
  watch();
};
$("close").onclick = () => oa.hide();
// Save as App and Discard live in the menu bar. Their sheet asks first
// (the name, or whether to throw it away) and hands the answer here.
let discarding = false;
window.__oaChose = async (save, name) => {
  if (chosenName != null || discarding || (S && S.moved)) return;
  follow = true; lastSig = "";
  if (save) {
    chosenName = name || (S && S.making && S.making.name) || ""; render();
    try { await oa.choose(true, chosenName); } catch (e) { chosenName = null; lastSig = ""; render(); }
  } else {
    discarding = true; render();
    try { await oa.choose(false, ""); } catch (e) { discarding = false; lastSig = ""; render(); }
  }
};
const carryOn = async text => {
  if (!text && !S) return;
  $("t").value = ""; $("t").style.height = "auto"; follow = true;
  try { await oa.carryOn(text); } catch (e) { $("hint").textContent = String(e); }
};
$("homeLink").onclick = () => { $("code").classList.remove("on"); setFull(false, true); oa.home(); };
// Fill the window: the conversation steps aside and the app takes the room.
let full = false, fullKey = null;
const FULL_IN = $("tbFull").innerHTML, FULL_OUT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7H9V3M3 9h4v4M9 7l4.5-4.5M7 9l-4.5 4.5"/></svg>';
function setFull(on, local) {
  full = on; fullKey = on && S && S.making ? S.making.started : null; document.body.classList.toggle("full", on);
  const b = $("tbFull"); b.innerHTML = on ? FULL_OUT : FULL_IN;
  b.title = on ? "Show the conversation" : "Fill the window"; b.setAttribute("aria-label", b.title);
  if (!local) oa.full(on).catch(() => {});
}
$("tbFull").onclick = () => setFull(!full);
$("tbSave").onclick = () => oa.ask(true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && full && !$("code").classList.contains("on")) setFull(false); });
$("nameBtn").onclick = e => {
  if (!S || !S.home) return;
  e.stopPropagation();
  const mn = $("menu"), r = $("nameBtn").getBoundingClientRect();
  mn.style.left = r.left + "px"; mn.style.top = (r.bottom + 4) + "px";
  const m = S.making, live = m && (m.phase === "done" || m.phase === "stopped" || m.phase === "failed") && !S.moved && chosenName == null && !discarding;
  mn.querySelector('[data-act="ask-discard"]').hidden = !live;
  mn.querySelector(".msep").hidden = !live;
  mn.hidden = !mn.hidden;
};
document.addEventListener("click", () => { $("menu").hidden = true; }, true);
// Return or Space on a line that opens does what a click does.
document.addEventListener("keydown", e => {
  const z = e.target.closest && e.target.closest("[data-zoom]");
  if (z && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); z.click(); }
});
document.addEventListener("click", async e => {
  const z = e.target.closest("[data-zoom]");
  // Selecting text in a summary isn't a click to fold it.
  if (z && !e.target.closest("[data-act]") && (window.getSelection().isCollapsed || !z.contains(window.getSelection().anchorNode))) {
    const key = z.dataset.zoom;
    if (key === "thought") thought.open = true;
    else if (opened.has(key)) opened.delete(key);
    else { opened.add(key); opening = key; }
    // Opening something stays where you are, instead of jumping to the newest.
    const keep = follow; follow = false; lastSig = ""; render(); follow = keep; opening = null;
    return;
  }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "carry-on") return carryOn("");
  if (a.dataset.act === "ask-discard") return oa.ask(false);
  if (a.dataset.act === "restore") {
    a.textContent = "Going back…";
    await run({ op: "restore", version: Number(a.dataset.v) }); await loadVersions();
  }
  if (a.dataset.act === "code") {
    const files = await oa.code(), tabs = $("tabs");
    tabs.querySelectorAll(".tab").forEach(x => x.remove());
    files.forEach((f, i) => {
      const b = document.createElement("span"); b.className = "tab" + (i ? "" : " on"); b.textContent = f.name;
      b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); $("src").textContent = f.text; $("src").scrollTop = 0; };
      tabs.insertBefore(b, $("codeX"));
    });
    $("src").textContent = files[0] ? files[0].text : ""; $("code").classList.add("on");
    if (S && S.home) oa.codeView(true).catch(() => {});
  }
});
const closeCode = () => { $("code").classList.remove("on"); if (S && S.home) oa.codeView(false).catch(() => {}); };
$("codeX").onclick = closeCode;
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("code").classList.contains("on")) closeCode(); });
tick().then(() => setTimeout(loadVersions, 300));
</script></body></html>
