<!doctype html><html><head><meta charset="utf-8"><title>Versions</title>
<style>
:root{--bg:#F4F4F5;--fg:#0B0B0C;--mute:#52525B;--line:#D4D4D8;--field:#FFFFFF;--accent:#0B0B0C;--on-accent:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B0C;--fg:#F4F4F5;--mute:#A1A1AA;--line:#2E2E33;--field:#161618;--accent:#FFFFFF;--on-accent:#0B0B0C}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
main{display:flex;flex-direction:column;gap:12px;padding:18px;height:100%}
h1{font-size:14px;font-weight:600;margin:0}
.list{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.v{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}.v:first-child{border-top:0}
.v .what{flex:1;min-width:0}.v b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v small{color:var(--mute)}.now{color:var(--accent);font-weight:600;font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row .grow{flex:1;color:var(--mute);min-height:1.4em}
button{font:inherit;padding:5px 12px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:default}.bad{color:#c4452c}
</style></head><body><main>
<h1 id="h">Versions</h1>
<div class="list" id="list"></div>
<div class="row"><span class="grow" id="s">Going back keeps the version you leave, and your data stays as it is.</span><button id="c">Close</button></div>
</main><script>
h.textContent = "Versions of " + (window.oa && oa.appName || "this app");
c.onclick = () => oa.close();
addEventListener("keydown", e => { if (e.key === "Escape") oa.close(); });
const run = req => new Promise(async res => {
  const job = await oa.start(req);
  const tick = async () => { const r = await oa.poll(job); r.done ? res(r.done) : setTimeout(tick, 250); };
  tick();
});
const ago = t => {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " minutes ago";
  if (s < 86400) return Math.round(s / 3600) + " hours ago";
  return new Date(t * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
};
async function load() {
  const r = await run({ op: "versions" });
  if (r.error) { s.className = "grow bad"; s.textContent = r.error; return; }
  list.innerHTML = "";
  for (const v of r.ok.versions) {
    const d = document.createElement("div"); d.className = "v";
    d.innerHTML = '<div class="what"><b></b><small></small></div>';
    d.querySelector("b").textContent = v.label;
    d.querySelector("small").textContent = ago(v.t);
    if (v.live) { const n = document.createElement("span"); n.className = "now"; n.textContent = "Now"; d.append(n); }
    else {
      const b = document.createElement("button"); b.textContent = "Go back to this";
      b.onclick = async () => {
        document.querySelectorAll("button").forEach(x => x.disabled = true); s.className = "grow"; s.textContent = "Going back…";
        const r = await run({ op: "restore", version: v.version });
        if (r.error) { s.className = "grow bad"; s.textContent = r.error; document.querySelectorAll("button").forEach(x => x.disabled = false); return; }
        s.textContent = "Done. The app has reloaded."; await load(); c.disabled = false;
      };
      d.append(b);
    }
    list.append(d);
  }
  if (r.ok.versions.length === 1) s.textContent = "Only one version so far. Each change you make is kept here.";
}
load();
</script></body></html>
