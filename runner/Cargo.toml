[package]
name = "runner"
version.workspace = true
edition.workspace = true
description = "OpenAs runner: one window that runs an app folder"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-notification = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openas-platform = { path = "../platform" }
dirs = "7"
tauri-plugin-dialog = "2"
trash = "5"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
